<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fingerprint</title>
  </head>
  <body>
    <main id="app" class="popup" aria-busy="true">
      <h1>fingerprint</h1>

      <section class="card" aria-labelledby="ip-module-title">
        <header class="card-header">
          <h2 id="ip-module-title">IP Module</h2>
          <input
            id="ip-enabled"
            class="checkbox"
            type="checkbox"
            aria-labelledby="ip-module-title"
            title="Enable IP Module"
          />
        </header>

        <div class="setting-list">
          <label class="setting-row" for="auto-timezone">
            <span>Set timezone automatically</span>
            <input id="auto-timezone" class="checkbox" type="checkbox" />
          </label>
          <label class="setting-row" for="auto-languages">
            <span>Set languages automatically</span>
            <input id="auto-languages" class="checkbox" type="checkbox" />
          </label>
        </div>

        <dl class="ip-info">
          <div><dt>IP</dt><dd id="ip-value">--</dd></div>
          <div><dt>Country</dt><dd id="country-value">--</dd></div>
          <div><dt>Timezone</dt><dd id="timezone-value">--</dd></div>
          <div><dt>Languages</dt><dd id="languages-value">--</dd></div>
          <div><dt>Updated</dt><dd id="updated-value">--</dd></div>
        </dl>

        <div id="status" class="status" role="alert" hidden></div>
        <button id="refresh-ip" type="button">Refresh IP</button>
      </section>

      <section class="card" aria-labelledby="webrtc-title">
        <header class="card-header">
          <div>
            <h2 id="webrtc-title">WebRTC</h2>
            <p>When disabled, WebRTC and media APIs are removed from web pages.</p>
          </div>
          <input
            id="webrtc-enabled"
            class="checkbox"
            type="checkbox"
            aria-labelledby="webrtc-title"
            title="Enable WebRTC"
          />
        </header>
      </section>

      <section class="card" aria-labelledby="fast-inject-title">
        <header class="card-header">
          <div>
            <h2 id="fast-inject-title">Fast injection</h2>
            <p>Uses Chrome's userScripts API to inject earlier. Compatibility mode is used when disabled.</p>
          </div>
          <input
            id="fast-inject-enabled"
            class="checkbox"
            type="checkbox"
            aria-labelledby="fast-inject-title"
            title="Enable fast injection"
          />
        </header>
      </section>
    </main>
    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
